name: Verificar bóveda y skills

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  check-vault:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar enlaces, IDs, frontmatter y skills
        run: python .agents/skills/istpetdev-docs/scripts/check_vault.py
